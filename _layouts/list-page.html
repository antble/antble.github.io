---
layout: default
---
<head>
  <!-- Link to the new stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/reading-list.css' | relative_url }}">
</head>

<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %d, %Y" }}</time>
      {%- if page.last_modified_at -%}
        • <span class="last-modified">Updated on <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">{{ page.last_modified_at | date: "%B %d, %Y" }}</time></span>
      {%- endif -%}
    </p>
  </header>

  <div class="post-content">
    <!-- This is where the content from your Markdown file will be inserted -->
    {{ content }}
  </div>

</article>
